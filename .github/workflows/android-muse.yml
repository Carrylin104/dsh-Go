# Manual build for a personal fork. Does not publish a release or require secrets.
name: Android + Muse

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-muse-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  DSH_MAVEN_MIRRORS: '0'

jobs:
  check:
    name: Media and Flutter checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and test media plugin
        working-directory: runtime/media/dsh-media
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install fonts required by the repository test harness
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
      - name: Check localization, analyze and test media settings
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          python3 tool/l10n_merge.py
          git diff --exit-code -- lib/l10n
          flutter analyze --no-pub
          flutter test --no-pub test/media/muse_settings_test.dart test/media/media_settings_test.dart test/media/media_catalog_test.dart
      - name: Pack the Muse media plugin
        working-directory: runtime/media/dsh-media
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
          cp MUSE2API{,.en}.md "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muse-media-plugin
          path: dist/
          if-no-files-found: error
          retention-days: 14

  apk:
    name: Build arm64 APK with bundled runtime
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install the Android components selected by Flutter
        shell: bash
        run: |
          set -euo pipefail
          extension=$(find "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main" -name 'FlutterExtension.*' -print -quit)
          ndk=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$extension" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          tawc_ndk=$(python3 -c 'import json; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          compile_sdk=$(grep -oE 'compileSdkVersion[^0-9]*[0-9]+' "$extension" | grep -oE '[0-9]+$' | head -1)
          test -n "$ndk" && test -n "$compile_sdk"
          sdkmanager "platform-tools" "platforms;android-$compile_sdk" "build-tools;$compile_sdk.0.0" "ndk;$ndk" "ndk;$tawc_ndk" "cmake;3.22.1"
          flutter config --no-analytics --android-sdk "$ANDROID_HOME" --jdk-dir "$JAVA_HOME"
      - name: Restore verified runtime downloads
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-
      - name: Build and verify the runtime
        run: |
          bash runtime/build-runtime.sh arm64-v8a
          python3 -I tooling/check_runtime_bundle.py arm64
      - name: Save verified downloads
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Prepare Flutter plugins and Gradle wrapper
        run: |
          cd app
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          cd android
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
      - name: Build APK through the repository build script
        # The hosted runner can point ANDROID_NDK_HOME at a different NDK.
        # Let tawcroot select its reviewed pin from the SDK; Flutter has its own ndkVersion.
        run: env -u ANDROID_NDK_HOME bash tooling/build-apk.sh --release -f arm64 --keep-daemon
      - name: Verify APK and write checksum
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk dist/dsh-go-muse-arm64.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose dist/dsh-go-muse-arm64.apk
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-muse-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
